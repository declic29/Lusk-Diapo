[package]
name = "deckcraft-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft renderer: slides, layouts and masters to pixels (vello_cpu): fills, outlines, effects, pictures, text, tables, charts"

[lints]
workspace = true

[dependencies]
deckcraft-geom = { workspace = true }
deckcraft-color = { workspace = true }
craft-metafile = { workspace = true }
deckcraft-model = { workspace = true }
deckcraft-anim = { workspace = true }
deckcraft-fonts = { workspace = true }
deckcraft-text = { workspace = true }
vello_cpu = { workspace = true }
vello_common = { workspace = true }
image = { workspace = true }
log = { workspace = true }
kurbo = { workspace = true }
skrifa = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
# SVG pictures (Insert › Pictures, drag and drop), drawn with the computer's fonts for their text.
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }

[dev-dependencies]
craft-metafile = { workspace = true, features = ["write"] }
